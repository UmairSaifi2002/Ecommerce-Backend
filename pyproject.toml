[project]
name = "ecommerce-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "UmairSaifi2002",email = "umairsaifi2002@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[all] (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "stripe (>=16.0.0,<17.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "greenlet (>=3.5.6,<4.0.0)",
    "bcrypt (==4.0.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PIE"]
ignore = [
    "B008",   # FastAPI Depends() in default args — standard pattern hai
]

[tool.ruff.lint.per-file-ignores]
"app/db/__init__.py" = ["F401", "I001"]   # re-exports intentional hain
"app/models/__init__.py" = ["F401"]       # model registration ke liye zaroori
